name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-parse-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt parse
        run: dbt parse --profiles-dir .

      - name: dbt compile
        run: dbt compile --profiles-dir .
