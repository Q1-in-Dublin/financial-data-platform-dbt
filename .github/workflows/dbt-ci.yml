name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-parse-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: financial_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-postgres==1.8.2

      - name: dbt parse
        run: dbt parse --profiles-dir .

      - name: dbt compile
        run: dbt compile --profiles-dir .
